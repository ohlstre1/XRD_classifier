# XRD Prototypical Classification Configuration
# Using existing data: data/xrd_dataset_labeled_dtw_window.pt

# =============================================================================
# Data Paths
# =============================================================================
data:
  # Synthetic training dataset (full dataset for training)
  synthetic_train_path: '../../data/xrd_dataset_labeled_dtw_window.pt'

  # Real validation dataset
  real_val_path: '../../data/xrd_train_val_dataset.pt'

  # Real test dataset
  real_test_path: '../../data/xrd_test_dataset.pt'

  # Legacy path for backward compatibility
  dataset_path: '../../data/xrd_dataset_labeled_dtw_window.pt'

  # Processed data paths
  augmentation_dir: 'data/processed/train_augmented'
  compound_mapping_path: 'data/processed/compound_mapping.json'
  split_path: 'data/processed/train_val_split.json'
  prototypes_path: 'data/prototypes/validation_prototypes.pt'

# =============================================================================
# Dual Augmentation Settings
# =============================================================================
augmentation:
  # Total augmentation strategy (reduced to prevent overfitting)
  n_augmentations: 5  # Reduced from 10 to prevent synthetic data dominance

  # Classical augmentation (from legacy/classical_xrd_augmenter.py)
  classical:
    enabled: false
    samples_ratio: 0.7  # Increased from 0.5 to favor physics-based augmentation

    # Realistic noise levels for XRD (reduced from [0.01, 0.1])
    noise_level_range: [0.005, 0.03]

    # Physically realistic peak broadening (reduced from [0.5, 2.0])
    peak_broadening_range: [0.8, 1.3]

    # Additional classical augmentation parameters
    intensity_variation:
      enabled: true
      scale_range: [0.8, 1.2]
    background_noise:
      enabled: true
      noise_level_range: [0.005, 0.03]
    peak_broadening:
      enabled: true
      broadening_range: [0.8, 1.3]

  # Diffusion model augmentation (from diffusion directory)
  diffusion:
    enabled: true
    samples_ratio: 0.5  # Reduced from 0.5 to limit AI-generated data
    model_path: '../../diffusion/models/xrd_diffusion/improved_diffusion_model_best.pth'
    temp_range: [0.3, 1.0]  # Reduced from [0.1, 2.0] for more conservative generation
    temp_mode: 'random'
    noise_timestep_range: [0, 50]
    use_classical_fallback: true

  # Beta distribution for noise (biased toward lower noise)
  noise_beta_alpha: 2
  noise_beta_beta: 5
  max_noise_level: 100  # Reduced from 1000 to prevent extreme noise

# =============================================================================
# Model Architecture
# =============================================================================
model:
  embedding_dim: 1024
  temperature: 0.3

  # Loss settings
  proto_weight: 1.0
  triplet_weight: 0.5
  triplet_margin: 0.2

# =============================================================================
# Training Hyperparameters
# =============================================================================
training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.0001
  min_lr: 0.0000005
  weight_decay: 0.0000001

  # Data loading (disabled multiprocessing and pin_memory to avoid CUDA issues)
  num_workers: 0
  pin_memory: false

  # Checkpointing
  save_every: 10

# =============================================================================
# Pattern Preprocessing
# =============================================================================
pattern_processing:
  # Duplicate synthetic patterns to increase base diversity
  pattern_duplication:
    enabled: true
    duplication_factor: 2  # Each synthetic pattern creates 2 copies (total 3 including original)
    duplication_noise: 0  # Small noise variation between duplicates

# =============================================================================
# Data Split
# =============================================================================
data_split:
  train_ratio: 1
  val_ratio: 0.4
  random_seed: 42

  # Sample limiting for consistent dataset sizes
  # Set to null to use all available samples
  max_train_samples: 100  # Limits synthetic training samples
  max_val_samples: 100    # Limits real validation samples
  max_test_samples: 100   # Limits real test samples

# =============================================================================
# Evaluation
# =============================================================================
evaluation:
  top_k_values: [1, 5, 10, 20, 50]

# =============================================================================
# Hardware & Logging
# =============================================================================
hardware:
  device: 'cuda'

logging:
  verbose: true
  tensorboard: true

# =============================================================================
# Wandb Configuration
# =============================================================================
wandb:
  enabled: true
  project: 'xrd-prototypical-classification'
  entity: null  # Set to your wandb username/team if needed
  tags: ['xrd', 'prototypical', 'classification']
  notes: 'XRD prototypical classification with dual augmentation'