# XRD ArcFace + SupCon Test Configuration
# Test configuration for ArcFace + Supervised Contrastive Loss

# =============================================================================
# Data Paths
# =============================================================================
data:
  # Synthetic training dataset (full dataset for training)
  synthetic_train_path: '../../data/xrd_dataset_labeled_dtw_window.pt'

  # Real validation dataset
  real_val_path: '../../data/xrd_train_val_dataset.pt'

  # Real test dataset
  real_test_path: '../../data/xrd_test_dataset.pt'

  # Legacy path for backward compatibility
  dataset_path: '../../data/xrd_dataset_labeled_dtw_window.pt'

  # Processed data paths
  augmentation_dir: 'data/processed/train_augmented'
  compound_mapping_path: 'data/processed/compound_mapping.json'
  split_path: 'data/processed/train_val_split.json'
  prototypes_path: 'data/prototypes/validation_prototypes.pt'

# =============================================================================
# Dual Augmentation Settings
# =============================================================================
augmentation:
  # Total augmentation strategy
  n_augmentations: 2  # Reduced for testing

  # Classical augmentation
  classical:
    enabled: false

  # Diffusion model augmentation
  diffusion:
    enabled: false  # Disabled for testing

  # Beta distribution for noise
  noise_beta_alpha: 2
  noise_beta_beta: 5
  max_noise_level: 100

# =============================================================================
# Model Architecture
# =============================================================================
model:
  embedding_dim: 256  # Reduced for testing
  temperature: 0.3

  # Loss type: "prototypical_triplet" or "arcface_supcon"
  loss_type: 'arcface_supcon'

  # Prototypical + Triplet loss settings (for loss_type='prototypical_triplet')
  proto_weight: 1.0
  triplet_weight: 0.5
  triplet_margin: 0.2

  # ArcFace loss settings (for loss_type='arcface_supcon')
  arcface_margin: 0.5      # Angular margin in radians
  arcface_scale: 30.0      # Scale factor for logits
  arcface_easy_margin: false

  # Supervised Contrastive loss settings (for loss_type='arcface_supcon')
  supcon_temperature: 0.07 # Temperature for supervised contrastive loss

# =============================================================================
# Training Hyperparameters
# =============================================================================
training:
  batch_size: 16  # Reduced for testing
  epochs: 2       # Reduced for testing
  learning_rate: 0.001
  min_lr: 0.00001
  weight_decay: 0.0000001

  # Data loading
  num_workers: 0
  pin_memory: false

  # Checkpointing
  save_every: 10

# =============================================================================
# Pattern Preprocessing
# =============================================================================
pattern_processing:
  # Duplicate synthetic patterns to increase base diversity
  pattern_duplication:
    enabled: false  # Disabled for testing
    duplication_factor: 2
    duplication_noise: 0

# =============================================================================
# Data Split
# =============================================================================
data_split:
  train_ratio: 1
  val_ratio: 0.4
  random_seed: 42

  # Sample limiting for testing
  max_train_samples: 10   # Very small for testing
  max_val_samples: 10     # Very small for testing
  max_test_samples: 10    # Very small for testing

# =============================================================================
# Evaluation
# =============================================================================
evaluation:
  top_k_values: [1, 5]  # Reduced for testing

# =============================================================================
# Hardware & Logging
# =============================================================================
hardware:
  device: 'cuda'

logging:
  verbose: true
  tensorboard: true

# =============================================================================
# Wandb Configuration
# =============================================================================
wandb:
  enabled: false  # Disabled for testing
  project: 'xrd-arcface-test'
  entity: null
  tags: ['xrd', 'arcface', 'supcon', 'test']
  notes: 'Test run for ArcFace + SupCon implementation'